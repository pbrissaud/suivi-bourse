# Crowdin configuration for the **documentation** — and for the documentation
# alone. The front (`app/web/src/i18n/*.json`) has a project of its own: ICU
# JSON against Markdown, a component's rhythm against a release's, and one
# review queue in front of both would make the slower corpus the pace of the
# faster one (ADR-0024, issue #712 for the front half).
#
# The file lives in `website/` rather than at the root for the same reason the
# projects are two: `base_path` is the directory of this file, so every source
# below is a path of the site, and the front's config can exist beside its own
# workspace without either having to disambiguate the other.
#
# The credentials are read from the environment, never written here:
project_id_env: CROWDIN_DOCS_PROJECT_ID
api_token_env: CROWDIN_DOCS_PERSONAL_TOKEN

base_path: '.'
preserve_hierarchy: true

# What is translated is the **current** corpus and nothing else (ADR-0024,
# ADR-0025). The frozen snapshots — `version-3.x/` and `version-4.x/`, under
# the site's versioned tree — appear in no source below, and that exclusion has
# two distinct reasons:
#
#  - `version-3.x/` is 1 792 frozen words of a product two majors old;
#  - `version-4.x/` is a corpus the v5 rewrite killed — 4 pages and 3 860 words
#    with no successor, nine more surviving only as subjects.
#
# Paying a translator, or a reviewer's attention, for either is paying for text
# whose only readers arrive from a search engine onto a page already banded
# *unmaintained*.
#
# The same rule reaches the theme JSON: `i18n/en/code.json` and the navbar and
# footer files are here, `docusaurus-plugin-content-docs/current.json` is here
# (it holds one string, the `v5` version label), and
# `docusaurus-plugin-content-docs/version-3.x.json` / `version-4.x.json` are
# **not** — they carry the frozen versions' sidebar categories, i.e. the dead
# taxonomy. They are not committed either (see `.gitignore`), so the exclusion
# is stated twice and cannot be re-introduced by a glob.
#
# The `i18n/en/**` sources are *generated*, by `pnpm write-translations`, and
# regenerating them before an upload is what keeps the navbar and this pipeline
# in step. Nothing under `i18n/fr/` is written by hand: it is Crowdin's output,
# landing here through an import.
#
# **One extension per entry, never a brace list.** Crowdin's globs are not a
# shell's: the CLI compiles a source pattern into a regex, and `*.{md,mdx}`
# becomes `.+\.{md,mdx}`, where `{` opens a repetition quantifier and the whole
# file is refused — `❌ Illegal repetition near index 5`. The failure is *at
# the tool*, not in the YAML, which is why `pnpm crowdin:lint` exists and is a
# gate: a YAML parser reads this file happily and Crowdin then uploads nothing.
files:
  - source: '/docs/**/*.md'
    translation: '/i18n/%two_letters_code%/docusaurus-plugin-content-docs/current/**/%original_file_name%'

  - source: '/docs/**/*.mdx'
    translation: '/i18n/%two_letters_code%/docusaurus-plugin-content-docs/current/**/%original_file_name%'

  - source: '/i18n/en/code.json'
    translation: '/i18n/%two_letters_code%/code.json'

  - source: '/i18n/en/docusaurus-theme-classic/**/*.json'
    translation: '/i18n/%two_letters_code%/docusaurus-theme-classic/**/%original_file_name%'

  - source: '/i18n/en/docusaurus-plugin-content-docs/current.json'
    translation: '/i18n/%two_letters_code%/docusaurus-plugin-content-docs/current.json'
