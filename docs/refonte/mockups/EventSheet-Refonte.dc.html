<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panneau · Saisir ou modifier un événement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/suivibourse/tokens.css">
<link rel="stylesheet" href="ds/suivibourse/components/bundle.css">
<script src="ds/suivibourse/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.fig{font-family:var(--font-mono);font-variant-numeric:tabular-nums;word-spacing:-0.32em}
.tab{padding:0 0 8px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font:inherit;font-size:14px;line-height:20px;color:var(--muted-foreground);cursor:pointer}
.tab:hover{color:var(--foreground)}
.tab[aria-checked="true"]{color:var(--foreground);font-weight:500;border-bottom-color:var(--foreground)}
.fld{display:flex;height:36px;box-sizing:border-box;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--foreground)}
.lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.btn{display:inline-flex;height:36px;align-items:center;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--background);color:var(--foreground);font:inherit;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.lnk{padding:0;border:0;background:none;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
</style>
</helmet>
<section role="dialog" aria-modal="true" aria-labelledby="event-title" style="width: 460px; height: 100%; min-height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; border-left: 1px solid var(--border)">

<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 0">
<div>
<h2 id="event-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">{{title}}</h2>
<sc-if value="{{isEdit}}" hint-placeholder-val="{{false}}"><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-foreground)">{{subtitle}}</p></sc-if>
</div>
<a href="GrandLivre-Refonte.dc.html" aria-label="Fermer" style="display: inline-flex; padding: 6px; margin: -6px -6px 0 0; border-radius: 6px; color: var(--muted-foreground)"><x-import component-from-global-scope="SuiviBourse.Icons.X" class-name="size-4" aria-hidden="true"></x-import></a>
</header>

<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 24px; overflow: auto">

<!-- Type : onglets texte, comme les onglets du graphique -->
<div role="radiogroup" aria-label="Ce qui s’est passé" style="display: flex; flex-wrap: wrap; gap: 0 18px; border-bottom: 1px solid var(--border)">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6">
<button type="button" role="radio" class="tab" aria-checked="{{t.on}}">{{t.label}}</button>
</sc-for>
</div>

<!-- Champs -->
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="7">
<label style="grid-column: {{f.span}}; display: flex; flex-direction: column; gap: 6px">
<span class="lbl">{{f.label}}</span>
<span class="fld"><span class="{{f.cls}}" style="color: {{f.color}}">{{f.value}}</span><span style="color: var(--muted-foreground); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.suffix}}</span></span>
</label>
</sc-for>
</div>

<p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--muted-foreground)">{{e0}}<span class="fig" style="color: var(--foreground)">{{e1}}</span>{{e2}}<span class="fig" style="color: var(--foreground)">{{e3}}</span>{{e4}}</p>

</div>

<footer style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border)">
<sc-if value="{{isEdit}}" hint-placeholder-val="{{false}}"><button type="button" class="lnk" style="color: var(--destructive); margin-right: auto">Supprimer cet événement</button></sc-if>
<a href="GrandLivre-Refonte.dc.html" class="btn">Annuler</a>
<a href="GrandLivre-Refonte.dc.html" class="btn" style="background: var(--primary); border-color: var(--primary); color: var(--primary-foreground)">{{cta}}</a>
</footer>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["creation","edition","versement"],"default":"creation"},"$preview":{"width":460,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'creation';
    const isEdit = mode === 'edition';
    const kind = mode === 'versement' ? 'Versement' : 'Achat';
    const types = ['Achat', 'Vente', 'Attribution', 'Dividende', 'Versement', 'Retrait'].map((label) => ({ label, on: label === kind ? 'true' : 'false' }));
    const F = (label, value, o = {}) => ({
      label, value,
      span: o.full ? '1 / -1' : 'auto',
      suffix: o.suffix ?? '',
      cls: o.mono ? 'fig' : '',
      color: o.placeholder ? 'var(--muted-foreground)' : 'var(--foreground)',
    });
    let fields, effect;
    if (kind === 'Versement') {
      fields = [
        F('Date', '1 nov. 2026', { mono: true, suffix: '▾' }),
        F('Compte', 'PEA', { suffix: '▾' }),
        F('Montant', '450,00', { mono: true, suffix: '€' }),
        F('Libellé', 'Virement depuis le compte courant', { full: true }),
      ];
      effect = ['Le PEA recevra ', '450,00 €', ' ; ses liquidités passeront à ', '1 490,00 €', '.'];
    } else if (isEdit) {
      fields = [
        F('Date', '1 oct. 2026', { mono: true, suffix: '▾' }),
        F('Compte', 'PEA', { suffix: '▾' }),
        F('Titre', 'CW8', { mono: true, full: true, suffix: 'Amundi MSCI World' }),
        F('Quantité', '1', { mono: true }),
        F('Prix unitaire', '541,20', { mono: true, suffix: '€' }),
        F('Frais', '1,35', { mono: true, suffix: '€' }),
        F('Libellé', 'Versement programmé mensuel', { full: true }),
      ];
      effect = ['1 × 541,20 € et 1,35 € de frais : ', '542,55 €', ' débités du PEA, dont les liquidités seront de ', '1 040,00 €', '.'];
    } else {
      fields = [
        F('Date', '7 nov. 2026', { mono: true, suffix: '▾' }),
        F('Compte', 'PEA', { suffix: '▾' }),
        F('Titre', 'Ticker ou nom', { full: true, placeholder: true }),
        F('Quantité', '', { mono: true }),
        F('Prix unitaire', '', { mono: true, suffix: '€' }),
        F('Frais', '0,00', { mono: true, suffix: '€' }),
        F('Libellé', 'Facultatif', { full: true, placeholder: true }),
      ];
      effect = ['Le PEA dispose de ', '1 040,00 €', ' de liquidités', '', '.'];
    }
    return {
      isEdit,
      title: isEdit ? 'Modifier l’événement' : 'Saisir un événement',
      subtitle: isEdit ? 'Achat du 1ᵉʳ oct. 2026 sur le PEA' : '',
      cta: isEdit ? 'Enregistrer' : 'Enregistrer',
      types, fields,
      e0: effect[0], e1: effect[1], e2: effect[2], e3: effect[3], e4: effect[4],
    };
  }
}
</script>
</body>
</html>
