<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panneau · Modèle d’imposition</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/suivibourse/tokens.css">
<link rel="stylesheet" href="ds/suivibourse/components/bundle.css">
<script src="ds/suivibourse/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.fig{font-family:var(--font-mono);font-variant-numeric:tabular-nums;word-spacing:-0.32em}
.tab{padding:0 0 8px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font:inherit;font-size:14px;line-height:20px;color:var(--muted-foreground);cursor:pointer}
.tab[aria-checked="true"]{color:var(--foreground);font-weight:500;border-bottom-color:var(--foreground)}
.fld{display:flex;height:36px;box-sizing:border-box;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--foreground);font-size:14px;min-width:0;overflow:hidden}
.lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.btn{display:inline-flex;height:36px;align-items:center;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--background);color:var(--foreground);font:inherit;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.lnk{padding:0;border:0;background:none;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.grp{margin:0;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:52px;border-bottom:1px solid var(--border)}
.opt .sub{font-size:12px;line-height:16px;color:var(--muted-foreground)}
</style>
</helmet>
<section role="dialog" aria-modal="true" aria-labelledby="tx-title" style="width: 460px; height: 100%; min-height: 1260px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; border-left: 1px solid var(--border)">

<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 0">
<div><h2 id="tx-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">{{title}}</h2>
<sc-if value="{{showEdit}}" hint-placeholder-val="{{true}}"><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-foreground)">Importé de la documentation · <button type="button" class="lnk" style="font-size: 13px">Vérifier les taux à la source</button></p></sc-if>
</div>
<a href="Reglages-Refonte.dc.html" aria-label="Fermer" style="display: inline-flex; padding: 6px; margin: -6px -6px 0 0; border-radius: 6px; color: var(--muted-foreground)"><x-import component-from-global-scope="SuiviBourse.Icons.X" class-name="size-4" aria-hidden="true"></x-import></a>
</header>

<div style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 20px 24px 24px; overflow-y: auto; overflow-x: hidden">

<!-- Ajout : importer ou écrire -->
<sc-if value="{{showAdd}}" hint-placeholder-val="{{false}}">
<div role="radiogroup" aria-label="Source" style="display: flex; gap: 18px; border-bottom: 1px solid var(--border)">
<button type="button" role="radio" class="tab" aria-checked="true">Importer pour mon pays</button>
<button type="button" role="radio" class="tab" aria-checked="false">Écrire le mien</button>
</div>
<div style="position: relative">
<span style="position: absolute; left: 11px; top: 10px; display: flex; color: var(--muted-foreground)"><x-import component-from-global-scope="SuiviBourse.Icons.Search" class-name="size-4" aria-hidden="true"></x-import></span>
<input type="search" value="France" style="width: 100%; height: 36px; box-sizing: border-box; padding: 0 12px 0 34px; border: 1px solid var(--input); border-radius: 8px; background: var(--background); color: var(--foreground); font: inherit; font-size: 14px; outline: none">
</div>
<div>
<p class="grp" style="margin-bottom: 4px">France</p>
<sc-for list="{{catalog}}" as="c" hint-placeholder-count="5">
<div class="opt">
<span style="display: flex; flex-direction: column; min-width: 0"><span>{{c.name}}</span><span class="sub">{{c.rule}}</span></span>
<span style="display: flex; align-items: center; gap: 12px"><span class="sub">{{c.state}}</span><button type="button" class="lnk" style="font-size: 13px">{{c.action}}</button></span>
</div>
</sc-for>
</div>
</sc-if>

<!-- Édition d'un modèle -->
<sc-if value="{{showEdit}}" hint-placeholder-val="{{true}}">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Libellé</span>
<span class="fld">Plan d’épargne en actions (PEA)</span>
</label>

<div style="display: flex; flex-direction: column; gap: 12px">
<p class="grp">Forme</p>
<div role="radiogroup" aria-label="Forme" style="display: flex; flex-wrap: wrap; gap: 0 18px; border-bottom: 1px solid var(--border)">
<button type="button" role="radio" class="tab" aria-checked="false">Non imposé</button>
<button type="button" role="radio" class="tab" aria-checked="false">Taux unique</button>
<button type="button" role="radio" class="tab" aria-checked="true">Taux selon l’âge de l’enveloppe</button>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px">
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Avant le seuil</span><span class="fld"><span class="fig">12,8</span><span style="font-size: 12px; color: var(--muted-foreground)">%</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Après le seuil</span><span class="fld"><span class="fig">0</span><span style="font-size: 12px; color: var(--muted-foreground)">%</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Seuil</span><span class="fld"><span class="fig">5</span><span style="font-size: 12px; color: var(--muted-foreground)">ans</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Compté depuis</span><span class="fld"><span>Le premier versement</span><x-import component-from-global-scope="SuiviBourse.Icons.ChevronDown" class-name="size-4" aria-hidden="true"></x-import></span></label>
<label style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1"><span class="lbl">Prélèvements sociaux <span style="font-weight: 400">· facultatif</span></span><span class="fld"><span class="fig">18,6</span><span style="font-size: 12px; color: var(--muted-foreground)">%</span></span></label>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 20px; border-top: 1px solid var(--border)">
<p class="grp">Comptes qui le portent</p>
<p style="margin: 0">PEA <span style="color: var(--muted-foreground)">· ouvert le <span class="fig">4 mars 2021</span>, seuil atteint</span></p>
</div>
</sc-if>

</div>

<footer style="display: flex; align-items: center; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border)">
<sc-if value="{{showEdit}}" hint-placeholder-val="{{true}}"><button type="button" class="lnk" style="color: var(--destructive); margin-right: auto">Supprimer ce modèle</button></sc-if>
<sc-if value="{{showAdd}}" hint-placeholder-val="{{false}}"><span style="margin-right: auto"></span></sc-if>
<a href="Reglages-Refonte.dc.html" class="btn">{{cancel}}</a>
<sc-if value="{{showEdit}}" hint-placeholder-val="{{true}}"><a href="Reglages-Refonte.dc.html" class="btn" style="background: var(--primary); border-color: var(--primary); color: var(--primary-foreground)">Enregistrer</a></sc-if>
</footer>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","add"],"default":"edit"},"$preview":{"width":460,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'edit';
    const showEdit = mode === 'edit', showAdd = mode === 'add';
    return {
      showEdit, showAdd,
      title: showEdit ? 'Plan d’épargne en actions (PEA)' : 'Ajouter un modèle d’imposition',
      cancel: showEdit ? 'Annuler' : 'Fermer',
      catalog: [
        { name: 'Plan d’épargne en actions (PEA)', rule: '12,8 % puis 0 % après 5 ans · PS 18,6 %', state: 'déjà importé', action: '' },
        { name: 'PEA-PME', rule: '12,8 % puis 0 % après 5 ans · PS 18,6 %', state: '', action: 'Importer' },
        { name: 'Compte-titres ordinaire (CTO)', rule: 'Forfaitaire 31,4 % (12,8 % + PS 18,6 %)', state: 'déjà importé', action: '' },
        { name: 'Assurance-vie', rule: '12,8 % puis 7,5 % après 8 ans · PS 17,2 % (assurance-vie)', state: '', action: 'Importer' },
        { name: 'Plan d’épargne retraite (PER)', rule: 'Au barème à la sortie', state: '', action: 'Importer' },
      ],
    };
  }
}
</script>
</body>
</html>
