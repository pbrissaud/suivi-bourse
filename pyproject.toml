[project]
name = "suivi-bourse"
# Written by release-please, never by hand — the same bump that writes
# `version.txt` and `.release-please-manifest.json` (extra-files, TOML
# updater). Nothing reads it at runtime: the image installs the `app`
# member, not this root, and what the process says about itself is the
# build stamp `build_info` reads. It is here so the file declares the
# release it belongs to rather than a placeholder.
version = "5.2.0"
description = "Monitors stock shares with yfinance and stores everything in one embedded DuckDB store, with historical backfill."
readme = "README.md"
requires-python = ">=3.14"
# The backend is four workspace members under `packages/` (#1199), sharing the
# `application` namespace. Dependencies point down: app → store, market → core.
# `tests/test_layers.py` holds the boundary (no import from a higher member,
# no heavy edge a member may not reach), since one venv lets an undeclared
# import succeed anyway.
dependencies = ["app"]

# Development / test tooling — installed by `uv sync`, excluded in Docker via UV_NO_DEV.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "flake8>=7.0.0",
]

# The root is not installable: it is the workspace, the dev tooling and the
# version release-please writes. The members are what gets built.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
app = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The markers this suite has, and they are registered rather than left implicit
# so `-m` is a supported selection and a typo in one is an error rather than a
# silent no-match. Both name a test the pull request gate must *not* run, and
# `.github/workflows/nightly-benchmarks.yml` is where both are run instead.
#
# `network`: talks to the live market. Nothing carries it except the probe of
# #760's closed list, which is the only assertion here that cannot be made
# against a fake: it checks that seven tickers still answer on Yahoo.
#
# `timing`: asserts seconds rather than rows (#995). Off the gate because a
# clock shared with three other branches' builds is not a clock a review
# comment can be written from, and because the ceilings exist to catch a
# pathology coming back, not to be a budget anyone tunes per pull request.
markers = [
    "network: talks to the live market; skipped everywhere but the nightly job",
    "timing: asserts an operation's seconds; skipped everywhere but the nightly job",
]
