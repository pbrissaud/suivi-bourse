[project]
name = "suivi-bourse"
# Written by release-please, never by hand — the same bump that writes
# `version.txt` and `.release-please-manifest.json` (extra-files, TOML
# updater). Nothing reads it at runtime: `pyproject.toml` reaches the
# builder stage alone, and what the process says about itself is the
# build stamp `build_info` reads. It is here so the file declares the
# release it belongs to rather than a placeholder.
version = "4.2.2"
description = "Monitors stock shares with yfinance and stores everything in one embedded DuckDB store, with historical backfill."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "APScheduler==3.11.3",
    # PyYAML left with the last file the app parsed (issue #698): `config.yaml`
    # went with the manual mode and `settings.yaml` with the accounts block, and
    # both are now named at startup rather than read. v5 parses no YAML at all.
    "duckdb>=1.4.0",       # the one embedded store (ADR-0001); opened before anything else
    # The frontier a wide read crosses (issue #700, spec #695 § 1): materialising
    # a TIMESTAMPTZ column costs 8x in rows and nothing in Arrow. It was already
    # installed as a transitive dependency of influxdb3-python, which leaves with
    # the database it spoke to — so this line adds no weight to the image, it
    # only stops a direct dependency from being satisfied by accident.
    "pyarrow>=17.0.0",
    "logfmt-logger==0.1.2",
    # The exporter's client left with the endpoint it was the whole of
    # (ADR-0033): one interface, one socket, and a dependency tree that says
    # what the application actually does.
    "urllib3==2.7.0",
    "yfinance==1.5.2",
    "pandas>=2.0.0",       # NaN-safe close prices in application/main.py (also required by yfinance)
    "openpyxl>=3.1.0",
    # `watchdog` left with the drop folder it watched (ADR-0032): a file is
    # handed to the app by `POST /api/events/import`, read once and never seen
    # again, so there is no directory left to observe.
    "numpy>=1.22.2",       # not directly required, pinned by Snyk to avoid a vulnerability
    "setuptools>=65.5.1",  # not directly required, pinned by Snyk to avoid a vulnerability
    "Flask==3.1.3",        # web UI + API, served in-process alongside the scheduler (issue #651)
    # The server, and the adapter that lets the Flask app above stay a WSGI app
    # (ADR-0039). gunicorn left because it always forks, and the fork is what
    # segfaults the scrape job on macOS — measured, not assumed. uvicorn is
    # called **programmatically** from `src/application/boot.py`, never from a
    # command line:
    # that is how its multiprocess mode stays out of reach without a guard.
    "uvicorn==0.52.4",
    "a2wsgi==1.10.10",
]

# Development / test tooling — installed by `uv sync`, excluded in Docker via UV_NO_DEV.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
]

# `src/` holds two packages — `application` (the app) and `api` (Flask) — and
# `src/web` (the front, which is not Python). Nothing here is installable, so
# uv manages the environment only and never tries to build/install it.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
