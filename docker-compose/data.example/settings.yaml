# SuiviBourse settings.
#
# A portfolio is a ledger of dated events and nothing else: drop your broker
# exports into the events/ folder next to this file and they are loaded. There
# is no mode to choose — a `config.yaml` sitting here is named at startup and
# never read.

events:
  # Where to read event files from. Defaults to <config dir>/events, i.e. the
  # events/ folder next to this file — no need to set it.
  # source: /home/appuser/.config/SuiviBourse/events/

  # Reload the portfolio as soon as an event file changes, instead of waiting
  # for the next ingestion cycle (SB_INGESTION_INTERVAL).
  watch: true

# Accounts are opt-in. Declaring them turns on the per-account performance
# series (account_metrics / portfolio_totals) and makes the `account` column
# mandatory in your event files.
#
# accounts:
# - id: pea
#   type: PEA
#   currency: EUR
#   label: PEA Bourso
# - id: cto
#   type: CTO
#   currency: EUR
#   label: CTO Degiro
