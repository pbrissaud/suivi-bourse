# SuiviBourse settings.
#
# Mode selection, highest priority first:
#   1. the SB_CONFIG_MODE environment variable (see .env)
#   2. the `mode:` key below
#   3. auto-detection: events mode as soon as the events/ folder next to this
#      file holds a .csv or .xlsx, manual mode otherwise
#
# Leaving `mode:` commented out is the recommended setup: drop your broker
# exports into events/ and the app switches to events mode on its own, with no
# second place to keep in sync. Uncomment it only to force a mode.
#
# mode: manual

events:
  # Where to read event files from. Defaults to <config dir>/events, i.e. the
  # events/ folder next to this file — no need to set it.
  # source: /home/appuser/.config/SuiviBourse/events/

  # Reload the portfolio as soon as an event file changes, instead of waiting
  # for the next ingestion cycle (SB_INGESTION_INTERVAL).
  watch: true

# Accounts are opt-in. Declaring them turns on the per-account performance
# series (account_metrics / portfolio_totals) and makes the `account` column
# mandatory in your event files.
#
# accounts:
# - id: pea
#   type: PEA
#   currency: EUR
#   label: PEA Bourso
# - id: cto
#   type: CTO
#   currency: EUR
#   label: CTO Degiro
