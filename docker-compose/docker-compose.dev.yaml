# SuiviBourse — development stack. Builds the app locally, runs InfluxDB
# without auth, serves the docs site, and defaults to the checked-in
# data.example/ config so it works with no setup step.
#
#   docker compose -f docker-compose.dev.yaml up -d
#   SB_CONFIG_DIR=./data docker compose -f docker-compose.dev.yaml up -d  # own config
name: ${COMPOSE_PROJECT_NAME:-suivi-bourse-dev}

services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse-dev}-app
    build: ../app
    restart: unless-stopped
    # Same reason as production (#658): the config mount is writable, so run as
    # the developer. On a Mac this stack *is* the dev loop — the app cannot run
    # natively any more, gunicorn forks and libcurl's Curl_macos_init then dies
    # in CoreFoundation — and a Mac uid (501) has no /etc/passwd entry, which is
    # precisely the case the image's ENV HOME covers.
    user: "${SB_UID:-1000}:${SB_GID:-1000}"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      SB_REGULAR_INTERVAL: ${SB_REGULAR_INTERVAL:-60}
      SB_PERF_INTERVAL: ${SB_PERF_INTERVAL:-60}
      SB_INGESTION_INTERVAL: ${SB_INGESTION_INTERVAL:-30}
      SB_BACKFILL_INTERVAL: ${SB_BACKFILL_INTERVAL:-30}
      SB_BACKFILL_DELAY: ${SB_BACKFILL_DELAY:-5}
      SB_BACKFILL_CHUNK_DAYS: ${SB_BACKFILL_CHUNK_DAYS:-365}
      SB_WEB_PORT: ${SB_WEB_PORT:-8080}
      SB_METRICS_PORT: ${SB_METRICS_PORT:-8081}
      SB_PROMETHEUS_ENABLED: ${SB_PROMETHEUS_ENABLED:-true}
      INFLUXDB_HOST: http://influxdb:8181
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      # No token needed - auth disabled in dev
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
    - ${SB_WEB_PORT:-8080}:${SB_WEB_PORT:-8080}          # Web UI + /health
    - ${SB_METRICS_PORT:-8081}:${SB_METRICS_PORT:-8081}  # Prometheus /metrics (legacy)
    volumes:
    # Writable, like production. Note that the default source is the checked-in
    # data.example/, so edits made through the UI land in the working tree.
    - ${SB_CONFIG_DIR:-./data.example}:/home/appuser/.config/SuiviBourse
    develop:
      watch:
        - action: rebuild
          path: ../app/src
        - action: rebuild
          path: ../app/pyproject.toml
        - action: rebuild
          path: ../app/uv.lock

  grafana:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse-dev}-graf
    image: grafana/grafana:13.1.2
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Dev InfluxDB runs without auth; the datasource still interpolates these.
      INFLUXDB_TOKEN: ""
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
    ports:
    - ${GRAFANA_PORT:-3000}:3000
    volumes:
    - ./grafana_provisioning:/etc/grafana/provisioning:ro
    develop:
      watch:
        - action: sync+restart
          path: ./grafana_provisioning
          target: /etc/grafana/provisioning

  influxdb:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse-dev}-influxdb
    image: influxdb:3-core
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: unless-stopped
    environment:
      INFLUXDB3_NODE_ID: suivi-bourse-dev
      INFLUXDB3_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3
      INFLUXDB3_WITHOUT_AUTH: "true"
      INFLUXDB3_QUERY_FILE_LIMIT: 20000
    ports:
    - ${INFLUXDB_PORT:-8181}:8181
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - sb_influxdb_data:/var/lib/influxdb3
    - ./influxdb3-init.sh:/init.sh:ro

  docs:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse-dev}-docs
    build: ../website
    ports:
    - ${DOCS_PORT:-4000}:80
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ../website/docs
        - action: rebuild
          path: ../website/src
        - action: rebuild
          path: ../website/docusaurus.config.js

volumes:
  sb_influxdb_data:
    driver: local
