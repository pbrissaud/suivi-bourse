# SuiviBourse — full stack (app + InfluxDB 3 Core + Grafana).
#
# Everything is tunable from .env; this file should not need editing. Copy
# .env.example to .env and data.example/ to data/ (or run `make init`), then
# `docker compose up -d`.
#
# This file publishes NO port: the services talk to each other over the compose
# network, and how they are reached from outside is a deployment decision.
# `docker-compose.expose.yaml` is the overlay that maps them onto host ports,
# and `.env.example` enables it through COMPOSE_FILE, so a local stack behaves
# exactly as before. Platforms that regenerate their own environment from this
# file alone (Coolify, Dokploy, …) get the unpublished variant and route to the
# services through their reverse proxy.
name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-app
    image: ghcr.io/pbrissaud/suivi-bourse-app:${SB_VERSION:-4}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      # Configuration mode. Left empty on purpose: the app then reads
      # settings.yaml and, failing an explicit `mode:`, infers the mode from
      # whether the config dir holds event files. Set to manual/events to force.
      SB_CONFIG_MODE: ${SB_CONFIG_MODE:-}
      # Scheduling
      SB_REGULAR_INTERVAL: ${SB_REGULAR_INTERVAL:-120}
      SB_PERF_INTERVAL: ${SB_PERF_INTERVAL:-120}
      SB_INGESTION_INTERVAL: ${SB_INGESTION_INTERVAL:-300}
      SB_STALENESS_HORIZON: ${SB_STALENESS_HORIZON:-900}
      SB_DYNAMIC_EXECUTOR_POOL: ${SB_DYNAMIC_EXECUTOR_POOL:-false}
      SB_EXECUTOR_POOL: ${SB_EXECUTOR_POOL:-10}
      # Backfill
      SB_BACKFILL_INTERVAL: ${SB_BACKFILL_INTERVAL:-60}
      SB_BACKFILL_DELAY: ${SB_BACKFILL_DELAY:-10}
      SB_BACKFILL_CHUNK_DAYS: ${SB_BACKFILL_CHUNK_DAYS:-365}
      # Legacy Prometheus endpoint
      SB_PROMETHEUS_ENABLED: ${SB_PROMETHEUS_ENABLED:-true}
      SB_METRICS_PORT: ${SB_METRICS_PORT:-8081}
      # Storage
      INFLUXDB_HOST: http://influxdb:8181
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
    # One mount for the whole config directory: settings.yaml, config.yaml and
    # events/ all live in there, so switching modes is a file drop rather than a
    # compose edit. Read-only — the app never writes to its config.
    - ${SB_CONFIG_DIR:-./data}:/home/appuser/.config/SuiviBourse:ro
    healthcheck:
      # Probes the /metrics endpoint, unless it has been turned off.
      test:
      - CMD-SHELL
      - >-
        test "$${SB_PROMETHEUS_ENABLED}" != "true" ||
        python3 -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SB_METRICS_PORT']+'/metrics',timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  grafana:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-graf
    image: grafana/grafana:13.1.2
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Consumed by the provisioned datasource through $$__env{...}, so the
      # token and database stay defined in .env only.
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
    volumes:
    - ./grafana_provisioning:/etc/grafana/provisioning:ro
    - sb_grafana_data:/var/lib/grafana
    logging: *logging

  influxdb:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-influxdb
    image: influxdb:3-core
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: unless-stopped
    environment:
      INFLUXDB3_NODE_ID: ${INFLUXDB_NODE_ID:-suivi-bourse}
      INFLUXDB3_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3
      # init.sh materialises the admin-token file from this value, so .env is
      # the single source of truth for the token.
      SB_INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - sb_influxdb_data:/var/lib/influxdb3
    - ./influxdb3-init.sh:/init.sh:ro
    logging: *logging

volumes:
  sb_influxdb_data:
    driver: local
  sb_grafana_data:
    driver: local
