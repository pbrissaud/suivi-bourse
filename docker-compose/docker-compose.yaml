# SuiviBourse — full stack (app + InfluxDB 3 Core + Grafana).
#
# Everything is tunable from .env; this file should not need editing. Copy
# .env.example to .env and data.example/ to data/ (or run `make init`), then
# `docker compose up -d`.
#
# This file publishes NO port: the services talk to each other over the compose
# network, and how they are reached from outside is a deployment decision.
# `docker-compose.expose.yaml` is the overlay that maps them onto host ports,
# and `.env.example` enables it through COMPOSE_FILE, so a local stack behaves
# exactly as before. Platforms that regenerate their own environment from this
# file alone (Coolify, Dokploy, …) get the unpublished variant and route to the
# services through their reverse proxy.
name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-app
    image: ghcr.io/pbrissaud/suivi-bourse-app:${SB_VERSION:-4}
    pull_policy: always
    restart: unless-stopped
    # No `depends_on: influxdb` since #700: the app speaks to no database but
    # its own embedded store, so waiting on that one's healthcheck would delay
    # — and, on a broken volume, block — a boot that has nothing to do with it.
    # The two containers are still in the stack; retiring them is #679/#680.
    # The config mount is writable (see below), so the container has to run as
    # whoever owns those files on the host — otherwise anything created under
    # the mount comes back owned by uid 1000 and the user can no longer edit
    # their own events. `make init` writes the invoking uid/gid into .env; an existing .env
    # without them falls back to 1000:1000, which is exactly today's behaviour.
    # The image sets HOME explicitly for this reason: a uid absent from
    # /etc/passwd gets HOME=/ from Docker, and the app resolves its config
    # directory through `~`.
    user: "${SB_UID:-1000}:${SB_GID:-1000}"
    environment:
      # The scheduling and backfill dials are **not** here any more (issue
      # #701, ADR-0014): they live in the store, are turned from the settings
      # page or with one `PUT /api/settings`, and take effect with no restart.
      # A line left here would be obeyed by nothing and named at start-up.
      # Web UI / API
      SB_WEB_PORT: ${SB_WEB_PORT:-8080}
      # Legacy Prometheus endpoint
      SB_PROMETHEUS_ENABLED: ${SB_PROMETHEUS_ENABLED:-true}
      SB_METRICS_PORT: ${SB_METRICS_PORT:-8081}
      # Storage
      INFLUXDB_HOST: http://influxdb:8181
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
    # One mount for the whole config directory: settings.yaml and events/ both
    # live in there, so adding a broker export is a file drop rather than a
    # compose edit.
    #
    # Writable since #658, and it stays that way now that #711 has removed the
    # app's write path: the human edits these files by hand, and `user:` above
    # is what keeps them owned by that human rather than by uid 1000.
    #
    # Long syntax on purpose. Coolify's compose parser rewrites bind-mount
    # sources at parse time, and for the *short* syntax it substitutes the
    # literal default written here (`./data`) without ever consulting the
    # application environment, then expands the leading `.` into its own clone
    # directory — mounting an empty folder however SB_CONFIG_DIR is set
    # (issue #646). The long-syntax source is copied through verbatim and
    # resolved at runtime by docker compose, like the image tag above.
    # `create_host_path` keeps the short syntax's habit of creating a missing
    # source directory, so a local `docker compose up` behaves as before.
    - type: bind
      source: ${SB_CONFIG_DIR:-./data}
      target: /home/appuser/.config/SuiviBourse
      bind:
        create_host_path: true
    healthcheck:
      # Probes /health on the web port, unconditionally. It used to probe
      # /metrics, which turned trivially green whenever SB_PROMETHEUS_ENABLED
      # was false — a deployment with the legacy endpoint off had no healthcheck
      # at all. Since #696 the route also *touches the store*: the old rule
      # — never reach the database, the app is meant to survive an outage rather
      # than be restarted for one — lost its subject the day the database became
      # a file this very process opens (ADR-0015). A store that does not answer
      # is not someone else's outage to ride out, it is this container unable to
      # do its job, so /health answers 503 and urlopen raises on it: that is what
      # turns the probe red.
      test:
      - CMD-SHELL
      - >-
        python3 -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SB_WEB_PORT']+'/health',timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  grafana:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-graf
    image: grafana/grafana:13.1.2
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Consumed by the provisioned datasource through $$__env{...}, so the
      # token and database stay defined in .env only.
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
    volumes:
    - ./grafana_provisioning:/etc/grafana/provisioning:ro
    - sb_grafana_data:/var/lib/grafana
    logging: *logging

  influxdb:
    container_name: ${COMPOSE_PROJECT_NAME:-suivi-bourse}-influxdb
    image: influxdb:3-core
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: unless-stopped
    environment:
      INFLUXDB3_NODE_ID: ${INFLUXDB_NODE_ID:-suivi-bourse}
      INFLUXDB3_DATABASE: ${INFLUXDB_DATABASE:-suivi_bourse}
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3
      # init.sh materialises the admin-token file from this value, so .env is
      # the single source of truth for the token.
      SB_INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
    healthcheck:
      # /health is authenticated when the server runs with an admin token, so a
      # bare curl answers 401 forever and the container never turns healthy.
      # CMD-SHELL (not CMD) so the container's shell expands the token; the
      # doubled $$ keeps compose from interpolating it at parse time.
      test:
      - CMD-SHELL
      - >-
        curl -fsS -H "Authorization: Bearer $${SB_INFLUXDB_ADMIN_TOKEN}"
        http://localhost:8181/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - sb_influxdb_data:/var/lib/influxdb3
    - ./influxdb3-init.sh:/init.sh:ro
    logging: *logging

volumes:
  sb_influxdb_data:
    driver: local
  sb_grafana_data:
    driver: local
