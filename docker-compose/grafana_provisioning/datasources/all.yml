# The token and database name are read from Grafana's environment (fed by .env
# through docker-compose.yaml), so credentials live in exactly one place.
apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    url: http://influxdb:8181
    access: proxy
    editable: false
    jsonData:
      version: SQL
      httpMode: POST
      dbName: $__env{INFLUXDB_DATABASE}
      insecureGrpc: true
      tlsSkipVerify: true
    secureJsonData:
      token: $__env{INFLUXDB_TOKEN}
