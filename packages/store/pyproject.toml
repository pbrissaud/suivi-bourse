# The one embedded store (ADR-0001), what reads it and the writers that need
# nothing above it. Independent of `market`.
[project]
name = "store"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "core",
    "duckdb>=1.4.0",       # the one embedded store (ADR-0001); opened before anything else
    # The frontier a wide read crosses (issue #700, spec #695 § 1): materialising
    # a TIMESTAMPTZ column costs 8x in rows and nothing in Arrow.
    "pyarrow>=17.0.0",
    "logfmt-logger==0.1.2",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "application"
namespace = true

