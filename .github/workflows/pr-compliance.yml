name: "Pull request compliance"
on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches:
      - master

permissions:
  pull-requests: write

jobs:
  dco-check:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: tisonkun/actions-dco@v1.1

  validate-pr-title:
    name: PR Title Validation
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/PRConventionalCommits@1.3.0
        with:
          # The six types CONTRIBUTING.md names, and the breaking form of the
          # three that can carry one. `refactor!` was allowed while plain
          # `refactor` was not, which failed the gate on a title the repository's
          # own vocabulary calls correct.
          task_types: '["feat", "fix", "refactor", "deps", "chore", "docs", "feat!", "fix!", "refactor!"]'
