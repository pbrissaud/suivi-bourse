name: Releasing process
on:
  push:
    branches:
      - master
    
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write 

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: "${{ secrets.TOKEN }}"
      GITHUB_BRANCH: "master"
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  docker:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}} 
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            paulbrissaud/suivi-bourse-app
            ghcr.io/pbrissaud/suivi-bourse-app
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{needs.create-release.outputs.tag_name}}
            type=semver,pattern={{major}}.{{minor}},value=${{needs.create-release.outputs.tag_name}}
            type=semver,pattern={{major}},value=${{needs.create-release.outputs.tag_name}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publish the compose stack itself to the registry, so the deployment can be
  # run without cloning or extracting a release:
  #   docker compose -f oci://ghcr.io/pbrissaud/suivi-bourse-stack:4 up -d
  # Non-blocking: a failure here must not fail an otherwise good release.
  compose:
    runs-on: ubuntu-latest
    needs: [create-release, docker]
    if: ${{needs.create-release.outputs.release_created}}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish compose stack
        working-directory: docker-compose
        env:
          TAG_NAME: ${{needs.create-release.outputs.tag_name}}
          # Only needed to satisfy the compose file's required-variable checks
          # at render time; the published stack carries no token.
          INFLUXDB_TOKEN: CHANGE_ME_IN_YOUR_ENV
        run: |
          version="${TAG_NAME#v}"
          major="${version%%.*}"
          for tag in "$version" "$major"; do
            docker compose -f docker-compose.yaml publish \
              "ghcr.io/pbrissaud/suivi-bourse-stack:${tag}" -y
          done

  doc:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11.9 requires node:sqlite (Node >= 22.5)
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build docs
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
