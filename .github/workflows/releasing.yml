name: Releasing process
on:
  push:
    branches:
      - master
    
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write 

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: "${{ secrets.TOKEN }}"
      GITHUB_BRANCH: "master"
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      pr: ${{ steps.release-please.outputs.pr }}

  request-review:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ needs.create-release.outputs.prs_created == 'true' }}
    steps:
      - run: gh pr edit "$PR" --add-reviewer pbrissaud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(needs.create-release.outputs.pr).number }}

  # One native runner per platform (ubuntu-24.04 and ubuntu-24.04-arm), then one
  # manifest list: Docker's own reusable workflow does the fan-out, the push by
  # digest and the merge. Under QEMU the arm64 half took ~5 of the 6 min 46 of
  # the v5.2.0 job; `.github/workflows/image-platforms.yml` builds the same two
  # platforms on every pull request that touches the image.
  docker:
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@v1.18.1
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The `-app` suffix named which of three services this was; there is
      # only one now. No compatibility alias: nothing migrates from v4, so
      # `suivi-bourse-app:5` never exists and a v4 install that bumps its
      # tag out of habit fails at the pull instead of starting on a store
      # that dies with the container.
      meta-images: |
        paulbrissaud/suivi-bourse
        ghcr.io/pbrissaud/suivi-bourse
      meta-tags: |
        type=semver,pattern={{version}},value=${{needs.create-release.outputs.tag_name}}
        type=semver,pattern={{major}}.{{minor}},value=${{needs.create-release.outputs.tag_name}}
        type=semver,pattern={{major}},value=${{needs.create-release.outputs.tag_name}}
        type=sha,prefix=
      set-meta-labels: true
      # The stamp the app itself reads (`build_info`). The labels above are
      # the same two facts for `docker inspect`, and they are not the same
      # thing: a label is read from outside the container, by somebody who
      # already knows which image they are looking at. These two are read
      # by the process, published on `/api/runtime`, and are what a bug
      # report carries.
      #
      # release-please's `version` rather than the tag name: `5.0.0` and not
      # `v5.0.0`, so the string the page shows is the string somebody would
      # `docker pull`.
      build-args: |
        RELEASE_VERSION=${{needs.create-release.outputs.version}}
        SOURCE_COMMIT=${{ github.sha }}
      # GitHub Actions cache, one scope per platform (the workflow suffixes
      # it). It aims at the next release rebuilding; the Dockerfile's
      # --mount=type=cache aims at the contributor rebuilding.
      cache: true
      cache-scope: suivi-bourse
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  doc:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11.9 requires node:sqlite (Node >= 22.5)
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build docs
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
