name: Releasing process
on:
  push:
    branches:
      - master
    
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write 

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: "${{ secrets.TOKEN }}"
      GITHUB_BRANCH: "master"
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  docker:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}} 
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          # The `-app` suffix named which of three services this was; there is
          # only one now. No compatibility alias: nothing migrates from v4, so
          # `suivi-bourse-app:5` never exists and a v4 install that bumps its
          # tag out of habit fails at the pull instead of starting on a store
          # that dies with the container.
          images: |
            paulbrissaud/suivi-bourse
            ghcr.io/pbrissaud/suivi-bourse
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{needs.create-release.outputs.tag_name}}
            type=semver,pattern={{major}}.{{minor}},value=${{needs.create-release.outputs.tag_name}}
            type=semver,pattern={{major}},value=${{needs.create-release.outputs.tag_name}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The stamp the app itself reads (`build_info`). The labels above are
          # the same two facts for `docker inspect`, and they are not the same
          # thing: a label is read from outside the container, by somebody who
          # already knows which image they are looking at. These two are read
          # by the process, published on `/api/runtime`, and are what a bug
          # report carries.
          #
          # `steps.meta.outputs.version` rather than the tag name: it is the
          # `{{version}}` the first tag pattern produced — `5.0.0` and not
          # `v5.0.0` — so the string the page shows is the string somebody
          # would `docker pull`.
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          # Registry cache, carried by a dedicated tag of the published image
          # (version-free, so it never depends on a tag that does not exist
          # yet). It aims at the PaaS rebuilding from zero — a different public
          # from the Dockerfile's --mount=type=cache, which aims at the
          # contributor rebuilding; confusing the two optimises neither.
          cache-from: type=registry,ref=ghcr.io/pbrissaud/suivi-bourse:buildcache
          cache-to: type=registry,ref=ghcr.io/pbrissaud/suivi-bourse:buildcache,mode=max

  doc:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{needs.create-release.outputs.release_created}}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11.9 requires node:sqlite (Node >= 22.5)
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build docs
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
