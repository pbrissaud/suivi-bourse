name: "Pull request checks"
on:
  pull_request:
    branches: [master]

# Least privilege: these jobs only read the checkout; no writes to the repo.
permissions:
  contents: read

jobs:
  python-linter:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ricardochaves/python-lint@v1.4.0
        with:
          python-root-list: "app/src/"
          use-pycodestyle: false
          use-pylint: false
          use-black: false
          use-mypy: false
          use-isort: false
          extra-flake8-options: "--ignore=E501"

  unit-test:
    name: "Unit Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: cd app && uv run pytest tests/

  web:
    name: "Front"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get changed files in the front folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v47
        with:
          files: |
            app/web/**
      - name: Install pnpm
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Set up Node.js
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          # pnpm 11.9 requires node:sqlite (Node >= 22.5)
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      # Three gates, and the order is the cost: types, then the suite, then the
      # bundle. `pnpm test` needs neither network nor configuration — the seam
      # fakes HTTP and errors on any request no handler names.
      - name: Check the front if it changed
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        working-directory: app/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

  image:
    name: "Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get changed files in the app folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v47
        with:
          files: |
            app/**
      # The jobs above run each half where every file of its directory is
      # present. The image's install layer sees only what the Dockerfile copies
      # into it, so a workspace file left out of that COPY breaks the build with
      # all the other gates green — which is how #713 shipped a broken image.
      # Until now the image was built only by the release workflow, i.e. after
      # the merge. This is the one gate that reads the Dockerfile.
      - name: Build the image if the app changed
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        working-directory: app
        run: docker build -t suivi-bourse:pr .

  build-docs:
    name: "Building doc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v47
        with:
          files: |
            website/**
      - name: Install pnpm
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - name: Set up Node.js
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          # pnpm 11.9 requires node:sqlite (Node >= 22.5)
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build docs if folder changed
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `pnpm build` never opens crowdin.yml, and a YAML parser is not a
      # substitute: the Crowdin CLI compiles each source pattern into a regex,
      # so `*.{md,mdx}` — valid YAML, valid shell — is refused at upload time
      # with `Illegal repetition`, and the whole corpus silently never reaches
      # the project. This is the only gate that runs the tool that consumes the
      # file. It reads the file alone, over no network, so the placeholder
      # credentials baked into the script are the honest shape here — no secret
      # is needed and a fork's pull request is checked like any other.
      - name: Lint the Crowdin configuration if the site changed
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        working-directory: website
        run: pnpm crowdin:lint
